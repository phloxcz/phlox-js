<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 110" preserveAspectRatio="none">
  <defs>
    <linearGradient id="band" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b8e9f0" stop-opacity="0"/>
      <stop offset="1" stop-color="#2cadba" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0" stop-color="#6fd3dc" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#2cadba" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0e95a8"/>
    </linearGradient>
    <!-- The waves fade out towards the bottom edge, so there is no cut where the picture ends -->
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="soft" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="110">
      <rect width="1600" height="110" fill="url(#fade)"/>
    </mask>
  </defs>
  <g mask="url(#soft)">
  <!-- A soft hump under the logo -->
  <path d="M120 110 C 300 18, 520 8, 720 68 C 850 106, 1000 112, 1150 92 L1150 110 Z" fill="#c9eef4" opacity=".75"/>
  <!-- The teal sweep at the right -->
  <path d="M860 110 C 1110 104, 1260 64, 1370 0 L1600 0 L1600 110 Z" fill="url(#band)"/>
  <path d="M1120 110 C 1290 96, 1400 52, 1470 0 L1600 0 L1600 50 C 1520 78, 1420 104, 1250 110 Z" fill="url(#deep)"/>
  <!-- Thin light lines over it -->
  <path d="M860 108 C 1130 102, 1350 74, 1530 0" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <path d="M1280 110 C 1410 84, 1500 44, 1600 16" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  </g>
</svg>
