<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Nákupní seznam</title>
  <style>
    /* The default theme turns dark with the system */
    :root { color-scheme: light dark; }
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 30rem; margin: 2rem auto; padding: 0 1rem; }
    nav { display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: .5rem; }
    nav a.active { font-weight: bold; }
    nav .languages { margin-left: auto; }
    form.add { display: flex; gap: .5rem; }
    form.add input { flex: 1; }
    form.add .dropdownlist-wrapper { width: 11rem; flex: none; }
    li .category { color: GrayText; font-size: .85em; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .5rem; padding: .25rem 0; }
    li a { flex: 1; }
    .done a { text-decoration: line-through; opacity: .6; }
    .history { padding-left: 1.5rem; }
    .change { display: grid; grid-template-columns: auto 1fr; gap: .25rem 1rem; margin: 0; }
    .change dt { color: #666; }
    .change dd { margin: 0; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
