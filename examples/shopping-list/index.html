<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Nákupní seznam</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 30rem; margin: 2rem auto; padding: 0 1rem; }
    nav { display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: .5rem; }
    nav a.active { font-weight: bold; }
    nav .languages { margin-left: auto; }
    form { display: flex; gap: .5rem; }
    input[type=text] { flex: 1; padding: .4rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .5rem; padding: .25rem 0; }
    li a { flex: 1; }
    .done a { text-decoration: line-through; opacity: .6; }
    .flash { padding: .5rem .75rem; border-radius: .25rem; background: #e7f0ff; cursor: pointer; }
    .flash.success { background: #e3f6e5; }
    .flash.error { background: #fde4e4; }
    .phlox-dialog { border: 1px solid #999; border-radius: .5rem; padding: 0; min-width: 20rem; }
    .phlox-dialog::backdrop { background: rgb(0 0 0 / .4); }
    .phlox-dialog header { display: flex; align-items: center; padding: .5rem 1rem; border-bottom: 1px solid #ddd; }
    .phlox-dialog header h2 { flex: 1; margin: 0; font-size: 1.1rem; }
    .phlox-dialog-body { padding: 1rem; }
    .phlox-dialog footer { display: flex; justify-content: flex-end; gap: .5rem; padding: .5rem 1rem; border-top: 1px solid #ddd; }
    .phlox-dialog footer:empty { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
