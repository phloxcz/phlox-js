<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Kendo UI</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 76rem; margin: 2rem auto; padding: 0 1rem; }
    body h1 { font-size: 1.5rem; }
    /* Cells drawn by the framework: links look like links, the theme of Kendo gives them the colour of text */
    .k-grid td a { color: var(--bs-link-color); }
    .toolbar { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin-bottom: 1rem; }
    .toolbar label { display: flex; flex-direction: column; gap: .25rem; font-size: .875rem; }
    .hint { color: var(--bs-secondary-color, GrayText); font-size: .875em; margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/kendo/main.ts"></script>
</body>
</html>
